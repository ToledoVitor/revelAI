name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  demo-quality:
    name: Demo-only quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @revelai/web exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Run canonical Linux visual gate
        run: >-
          docker run --rm
          --env CI=true
          --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
          --volume "$GITHUB_WORKSPACE:/work"
          --workdir /work
          mcr.microsoft.com/playwright:v1.62.1-noble
          bash -lc 'corepack enable && corepack pnpm@11.20.0 --filter @revelai/design-system run build && corepack pnpm@11.20.0 --filter @revelai/web run test:visual:canonical'
      - run: pnpm --filter @revelai/api run openapi:check
      - run: pnpm --filter @revelai/api exec vitest run src/http/operability-routes.test.ts src/startup.test.ts src/http/openapi.test.ts

  demo-operability:
    name: Demo-only clean executable and operability probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:clean-api-executables:self-test
      - run: pnpm run ci:clean-api-executables:cancellation-probe:self-test
      - run: pnpm run ci:clean-api-executables:cancellation-probe
      - run: pnpm run ci:clean-api-executables
      - run: pnpm --filter @revelai/api run test:operability
