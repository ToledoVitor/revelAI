name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  demo-quality:
    name: Demo-only quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @revelai/web exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm --filter @revelai/web run test:production-router
      - name: Run canonical Linux visual gate
        env:
          PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
        run: |
          revelai_pnpm_root="$(dirname "$PNPM_HOME")"
          revelai_pnpm_store="$(pnpm store path)"
          test -f "$revelai_pnpm_root/pnpm/bin/pnpm.cjs"
          test -d "$revelai_pnpm_store"
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --env CI=true \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --env PNPM_CONFIG_STORE_DIR="$revelai_pnpm_store" \
            --env PNPM_CONFIG_OFFLINE=true \
            --env pnpm_config_verify_deps_before_run=error \
            --env PATH=/pnpm/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$revelai_pnpm_root:/pnpm:ro" \
            --volume "$revelai_pnpm_store:$revelai_pnpm_store:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            "$PLAYWRIGHT_IMAGE" \
            node /pnpm/pnpm/bin/pnpm.cjs --filter @revelai/design-system run build
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --env CI=true \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --env PNPM_CONFIG_STORE_DIR="$revelai_pnpm_store" \
            --env PNPM_CONFIG_OFFLINE=true \
            --env pnpm_config_verify_deps_before_run=error \
            --env PATH=/pnpm/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$revelai_pnpm_root:/pnpm:ro" \
            --volume "$revelai_pnpm_store:$revelai_pnpm_store:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            "$PLAYWRIGHT_IMAGE" \
            node /pnpm/pnpm/bin/pnpm.cjs --filter @revelai/web run test:visual:canonical
      - run: pnpm --filter @revelai/api run openapi:check
      - run: pnpm --filter @revelai/api exec vitest run src/http/operability-routes.test.ts src/startup.test.ts src/http/openapi.test.ts

  demo-operability:
    name: Demo-only clean executable and operability probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:clean-api-executables:self-test
      - run: pnpm run ci:clean-api-executables:cancellation-probe:self-test
      - run: pnpm run ci:clean-api-executables:cancellation-probe
      - run: pnpm run ci:clean-api-executables
      - run: pnpm --filter @revelai/api run test:operability
